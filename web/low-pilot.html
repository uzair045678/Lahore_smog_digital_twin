<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lahore LOW Pilot</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1118; color: #e7edf3; font: 13px system-ui, sans-serif; }
      #viewer { width: 100%; height: 100%; display: block; }
      #hud, #legend { position: fixed; padding: 10px 12px; background: #101a24e6; border: 1px solid #344757; border-radius: 6px; line-height: 1.45; white-space: pre; }
      #hud { top: 12px; left: 12px; }
      #legend { top: 12px; right: 12px; white-space: normal; }
      #controls { position: fixed; bottom: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 420px; }
      button { background: #1b2a38; border: 1px solid #587083; color: #e7edf3; border-radius: 4px; padding: 6px 9px; cursor: pointer; }
      button:hover { background: #294052; }
      .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; }
    </style>
  </head>
  <body>
    <canvas id="viewer" aria-label="Lahore low detail pilot map"></canvas>
    <div id="hud">Loading LOW pilot…</div>
    <div id="legend"><strong>LOW development viewer</strong><br><span class="swatch" style="background:#788696"></span>Residential<br><span class="swatch" style="background:#8f8065"></span>Commercial<br><span class="swatch" style="background:#786f8e"></span>Industrial<br><span class="swatch" style="background:#6d8991"></span>Institutional<br><span class="swatch" style="background:#69737e"></span>Unknown<br><br>Grid: green dense · amber sparse · red zero</div>
    <div id="controls"><button data-camera="overview">Overview (1)</button><button data-camera="oblique">Oblique (2)</button><button data-camera="top">Top (3)</button><button data-camera="close">Close (4)</button><button id="grid-toggle">Hide coverage grid</button></div>
    <script type="module" src="/src/lowPilot.ts"></script>
  </body>
</html>
